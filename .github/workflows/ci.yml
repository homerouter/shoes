name: CI

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'include/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'include/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CROSS_VERSION: 0.2.5
  SHOES_BUILD_REVISION: ${{ github.sha }}
  RUST_BACKTRACE: 1
  # Test peer pins, kept in step with upstream cfal/shoes test.yml.
  SING_BOX_VERSION: 1.14.1
  SING_BOX_SHA256: 12cb2816b52febb356f6a885b740cc8758c3f30b8ae0ca8edba80f0d2d35343f
  ANYTLS_SING_BOX_VERSION: 1.15.0-alpha.13
  ANYTLS_SING_BOX_SHA256: bfc39f643a5ecc1b702c5723ff662e61dde813f12b3af0d0cfce4f629ff74047
  MIHOMO_VERSION: 1.19.31
  MIHOMO_SHA256: 04cf9f09671704f839ddbee2e93069dc831a4123a75281e725d1d96ab9ac1afc
  XRAY_VERSION: 26.10.31
  XRAY_SHA256: e4bd9119f50ae7c41658b1abd0679ae06f98bd864a2907ff33f2f2cf7081b214
  SSSERVER_VERSION: 1.25.0
  SSSERVER_SHA256: 874f817fcf3e6d7681ec715a1c13c686c6eaae936524d102639b38364f3966ae
  NAIVE_CADDY_VERSION: 2.11.7-naive
  NAIVE_CADDY_SHA256: ac97057c925bb098eb575e7b0cb8bd547d4c5f845b09a3dedfbe34444aa7ae88

defaults:
  run:
    shell: bash

jobs:
  detect:
    name: Detect code changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # run: any test job; build: binaries (code changed, not just tests).
      run: ${{ steps.filter.outputs.run }}
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether code, tests or dependencies changed
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import tomllib

          def write_out(code: bool, tests: bool = False) -> None:
              run, build = code or tests, code
              print(f"run={run} build={build}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"run={str(run).lower()}\nbuild={str(build).lower()}\n")
              raise SystemExit(0)

          event = os.environ["EVENT_NAME"]
          if event == "workflow_dispatch":
              write_out(True)

          zero = "0" * 40
          base = os.environ.get("PR_BASE") if event == "pull_request" else os.environ.get("PUSH_BEFORE", "")
          if base and base != zero and subprocess.run(["git", "cat-file", "-e", f"{base}^{{commit}}"], capture_output=True).returncode != 0:
              # Force-push: the old tip is gone, so HEAD^ (often the version bump) would hide every rewritten change.
              write_out(True)
          if not base or base == zero:
              base = "HEAD^"

          if subprocess.run(["git", "cat-file", "-e", f"{base}^{{commit}}"], capture_output=True).returncode != 0:
              write_out(True)

          changed = subprocess.check_output(["git", "diff", "--name-only", base, "HEAD"], text=True).splitlines()
          print("Changed files:", changed)
          code_prefixes = ("src/", "include/", ".cargo/")
          code_files = {"build.rs", ".github/workflows/ci.yml"}
          tests = any(f.startswith(("tests/", "benches/")) for f in changed)
          if any(f in code_files or f.startswith(code_prefixes) for f in changed):
              write_out(True)

          def strip_own_version(rev: str, path: str):
              raw = subprocess.check_output(["git", "show", f"{rev}:{path}"], text=True)
              data = tomllib.loads(raw)
              if path == "Cargo.toml":
                  data["package"].pop("version", None)
              else:
                  for pkg in data.get("package", []):
                      if pkg.get("name") == "shoes" and "source" not in pkg:
                          pkg.pop("version", None)
              return data

          for path in [f for f in changed if f in ("Cargo.toml", "Cargo.lock")]:
              if strip_own_version(base, path) != strip_own_version("HEAD", path):
                  write_out(True)

          write_out(False, tests)
          PY

  unit:
    name: Unit tests
    needs: [detect]
    if: needs.detect.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          key: unit
          cache-targets: "true"

      - name: Run Snell unit tests
        run: |
          .github/require-tests.sh cargo test --lib --locked snell

      - name: Run local tests
        run: cargo test --workspace --locked --lib --bins

      - name: Check resolved configuration type contracts
        run: .github/require-tests.sh cargo test -p shoes --locked --doc config::resolved

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: false

      - name: Build pinned AnyTLS reference peer
        working-directory: tests/fixtures/anytls-peer
        run: GOMAXPROCS=1 go build -mod=readonly -p 1 -o "$RUNNER_TEMP/shoes-anytls-peer" .

      - name: Test AnyTLS pooling against the reference peer
        env:
          ANYTLS_REFERENCE_PEER: ${{ runner.temp }}/shoes-anytls-peer
          CARGO_BUILD_JOBS: 1
        run: >-
          .github/require-tests.sh cargo test -p shoes --locked --lib
          reference_peer_tcp_uot_and_concurrent_session_reuse -- --ignored

      - name: Run process contract tests
        run: cargo test -p shoes --locked --test process_contract -- --test-threads=1

      - name: Run rule allocation, retention and matcher tests
        run: |
          cargo test -p shoes --locked --test rule_allocation
          cargo test -p shoes --locked --test retention_allocation --test matcher_invariants -- --nocapture

      - name: Run bounded rule property corpus
        env:
          CARGO_BUILD_JOBS: 1
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: timeout --kill-after=5s 30s
        run: >-
          .github/require-tests.sh timeout --kill-after=10s 10m cargo test -p shoes --locked
          --test rule_properties -- --test-threads=1

      - name: Run host FFI tests
        run: cargo test -p shoes --locked --lib --features ffi -- --test-threads=1

  singbox:
    name: sing-box WireGuard interop
    needs: [detect]
    if: needs.detect.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          key: singbox
          cache-targets: "true"

      - name: Cache sing-box binary
        id: cache-singbox
        uses: actions/cache@v6
        with:
          path: /usr/local/bin/sing-box
          key: singbox-official-bin-1.14.4

      - name: Download official sing-box
        if: steps.cache-singbox.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/singbox"
          for attempt in 1 2 3 4 5; do
            gh release download v1.14.4 --repo SagerNet/sing-box \
              --pattern "sing-box-*-linux-amd64.tar.gz" \
              --dir "$RUNNER_TEMP/singbox" && break || {
              if [ "$attempt" -eq 5 ]; then
                echo "Failed to download sing-box after 5 attempts"
                exit 1
              fi
              echo "Download failed (attempt $attempt), retrying in 5s..."
              sleep 5
            }
          done
          tar -xzf "$RUNNER_TEMP/singbox"/sing-box-*-linux-amd64.tar.gz -C "$RUNNER_TEMP/singbox" --strip-components=1
          sudo mv "$RUNNER_TEMP/singbox/sing-box" /usr/local/bin/sing-box
          sudo chmod +x /usr/local/bin/sing-box
          /usr/local/bin/sing-box version

      - name: Run sing-box WireGuard interop tests
        run: |
          SHOES_TEST_SING_BOX_BIN=/usr/local/bin/sing-box cargo test --test optional_peer --features optional-peer-tests wireguard::wireguard_singbox_both_roles -- --ignored
          SHOES_TEST_SING_BOX_BIN=/usr/local/bin/sing-box cargo test --test optional_peer --features optional-peer-tests wireguard::wireguard_singbox_lazy -- --ignored

  snell:
    name: Snell interop
    needs: [detect]
    if: needs.detect.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          key: snell
          cache-targets: "true"

      - name: Cache sing-box Snell fork binary
        id: cache-singbox-snell
        uses: actions/cache@v6
        with:
          path: /usr/local/bin/sing-box-snell
          key: singbox-snell-reF1nd-e7c5f20810451fb3b9756b6ecf8acef397ccc1f3

      - name: Install Go for the sing-box Snell fork
        if: steps.cache-singbox-snell.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false

      - name: Build sing-box Snell fork
        if: steps.cache-singbox-snell.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none https://github.com/reF1nd/sing-box "$RUNNER_TEMP/sing-box-snell"
          cd "$RUNNER_TEMP/sing-box-snell"
          git checkout e7c5f20810451fb3b9756b6ecf8acef397ccc1f3
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/sing-box-snell-bin" ./cmd/sing-box
          sudo mv "$RUNNER_TEMP/sing-box-snell-bin" /usr/local/bin/sing-box-snell
          /usr/local/bin/sing-box-snell version

      - name: Run sing-box Snell interop tests
        run: |
          SHOES_TEST_SING_BOX_SNELL_BIN=/usr/local/bin/sing-box-snell .github/require-tests.sh cargo test --test optional_peer --features optional-peer-tests snell_singbox:: -- --ignored --test-threads=1

  privileged:
    name: Privileged tests
    needs: [detect]
    if: needs.detect.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          key: privileged
          cache-targets: "true"

      - name: Run privileged tests
        run: |
          sudo -E env PATH="$PATH" cargo test --lib --locked root_config_check_accepts_service_owned_state -- --ignored
          sudo -E env PATH="$PATH" cargo test --lib --locked public_device_factory_preserves_unframed_packets -- --ignored

  xhttp:
    name: XHTTP interop
    needs: [detect]
    if: needs.detect.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Same pins as upstream cfal/shoes test.yml; Xray a4a3dff is v26.10.31.
      XRAY_COMMIT: a4a3dff5b20c2faae567b742c172c7b95e75c083
      MIHOMO_ALPHA_COMMIT: 94b13aed49b8dc41973e4bb3f721c5fa2c5c5c1f
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          key: xhttp
          cache-targets: "true"

      - name: Restore pinned XHTTP peers
        id: xhttp-peers
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/shoes-xray/xray
            ~/.cache/shoes-mihomo/mihomo
          key: ${{ runner.os }}-xhttp-peers-go1.27.4-${{ env.XRAY_COMMIT }}-${{ env.MIHOMO_ALPHA_COMMIT }}

      - name: Install Go for XHTTP peers
        if: steps.xhttp-peers.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: false

      - name: Build pinned Xray test peer
        if: steps.xhttp-peers.outputs.cache-hit != 'true'
        run: |
          source="$HOME/.cache/shoes-xray"
          git clone --filter=blob:none --no-checkout https://github.com/XTLS/Xray-core.git "$source"
          git -C "$source" checkout --detach "$XRAY_COMMIT"
          test "$(git -C "$source" rev-parse HEAD)" = "$XRAY_COMMIT"
          cd "$source"
          go build -o "$source/xray" ./main

      - name: Build pinned Mihomo Alpha test peer
        if: steps.xhttp-peers.outputs.cache-hit != 'true'
        run: |
          source="$HOME/.cache/shoes-mihomo"
          git clone --filter=blob:none --no-checkout https://github.com/MetaCubeX/mihomo.git "$source"
          git -C "$source" checkout --detach "$MIHOMO_ALPHA_COMMIT"
          test "$(git -C "$source" rev-parse HEAD)" = "$MIHOMO_ALPHA_COMMIT"
          cd "$source"
          CGO_ENABLED=0 go build \
            -ldflags "-X github.com/metacubex/mihomo/constant.Version=alpha-${MIHOMO_ALPHA_COMMIT:0:8}" \
            -o "$source/mihomo" .

      - name: Save pinned XHTTP peers
        if: steps.xhttp-peers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/shoes-xray/xray
            ~/.cache/shoes-mihomo/mihomo
          key: ${{ steps.xhttp-peers.outputs.cache-primary-key }}

      - name: Select XHTTP peers
        run: |
          echo "SHOES_TEST_XRAY_BIN=$HOME/.cache/shoes-xray/xray" >> "$GITHUB_ENV"
          echo "SHOES_TEST_MIHOMO_BIN=$HOME/.cache/shoes-mihomo/mihomo" >> "$GITHUB_ENV"
          "$HOME/.cache/shoes-xray/xray" version
          "$HOME/.cache/shoes-mihomo/mihomo" -v

      - name: Run XHTTP interop tests
        env:
          RUST_LOG: warn
        run: |
          .github/require-tests.sh cargo test --locked --features integration-tests \
            --test xhttp_interop -- --test-threads=1

  clippy:
    name: Clippy
    needs: [detect]
    if: needs.detect.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          key: clippy

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  msrv:
    name: Minimum Rust (Cargo.toml rust-version)
    needs: [detect]
    if: needs.detect.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v7

      - name: Read rust-version
        id: msrv
        run: echo "version=$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["package"]["rust-version"])')" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}

      # The fork lowers rust-version to 1.96.1 for building shoes; upstream test code may use newer APIs.
      - name: Check minimum supported Rust
        run: cargo check --workspace --lib --bins --all-features --locked

  integration:
    name: Integration (local protocols)
    needs: [detect]
    if: needs.detect.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          key: integration
          cache-targets: "true"

      - name: Install sing-box test peer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/sing-box.tar.gz"
          gh release download "v${SING_BOX_VERSION}" --repo SagerNet/sing-box \
            --pattern "sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz" --output "$archive"
          echo "${SING_BOX_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          binary="$RUNNER_TEMP/sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box"
          chmod +x "$binary"
          echo "SHOES_TEST_SING_BOX_BIN=$binary" >> "$GITHUB_ENV"

      - name: Run sing-box mux lifecycle tests
        run: >-
          .github/require-tests.sh cargo test -p shoes --locked --lib --features integration-tests
          h2mux::h2mux_server_session::singbox_interop_tests:: -- --test-threads=1

      - name: Run bounded XUDP payload integrity regression
        run: >-
          .github/require-tests.sh cargo test -p shoes --locked --features stress-tests
          --test stress vless_xudp_long_lived::test_content_integrity_varying_sizes
          -- --exact --test-threads=1

      - name: Run integration tests
        env:
          RUST_LOG: warn
        run: >-
          .github/require-tests.sh cargo test -p shoes --locked --features integration-tests
          --test integration -- --test-threads=1

  optional-peers:
    name: Optional peer interop
    needs: [detect]
    if: needs.detect.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          key: optional-peers
          cache-targets: "true"

      - name: Install sing-box test peer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/sing-box.tar.gz"
          gh release download "v${SING_BOX_VERSION}" --repo SagerNet/sing-box \
            --pattern "sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz" --output "$archive"
          echo "${SING_BOX_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          binary="$RUNNER_TEMP/sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box"
          chmod +x "$binary"
          echo "SHOES_TEST_SING_BOX_BIN=$binary" >> "$GITHUB_ENV"

      - name: Install sing-box AnyTLS padding test peer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/sing-box-anytls.tar.gz"
          gh release download "v${ANYTLS_SING_BOX_VERSION}" --repo SagerNet/sing-box \
            --pattern "sing-box-${ANYTLS_SING_BOX_VERSION}-linux-amd64.tar.gz" --output "$archive"
          echo "${ANYTLS_SING_BOX_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          binary="$RUNNER_TEMP/sing-box-${ANYTLS_SING_BOX_VERSION}-linux-amd64/sing-box"
          chmod +x "$binary"
          echo "SHOES_TEST_ANYTLS_SING_BOX_BIN=$binary" >> "$GITHUB_ENV"

      - name: Install Mihomo test peer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/mihomo.gz"
          binary="$RUNNER_TEMP/mihomo"
          gh release download "v${MIHOMO_VERSION}" --repo MetaCubeX/mihomo \
            --pattern "mihomo-linux-amd64-compatible-v${MIHOMO_VERSION}.gz" --output "$archive"
          echo "${MIHOMO_SHA256}  ${archive}" | sha256sum --check --strict
          gzip --decompress --stdout "$archive" > "$binary"
          chmod +x "$binary"
          echo "SHOES_TEST_MIHOMO_BIN=$binary" >> "$GITHUB_ENV"

      - name: Install Xray test peer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/xray.zip"
          gh release download "v${XRAY_VERSION}" --repo XTLS/Xray-core \
            --pattern Xray-linux-64.zip --output "$archive"
          echo "${XRAY_SHA256}  ${archive}" | sha256sum --check --strict
          unzip "$archive" xray -d "$RUNNER_TEMP/xray-peer"
          binary="$RUNNER_TEMP/xray-peer/xray"
          chmod +x "$binary"
          echo "SHOES_TEST_XRAY_BIN=$binary" >> "$GITHUB_ENV"

      - name: Install shadowsocks-rust test peer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/shadowsocks-rust.tar.xz"
          gh release download "v${SSSERVER_VERSION}" --repo shadowsocks/shadowsocks-rust \
            --pattern "shadowsocks-v${SSSERVER_VERSION}.x86_64-unknown-linux-gnu.tar.xz" --output "$archive"
          echo "${SSSERVER_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --xz --file "$archive" --directory "$RUNNER_TEMP" ssserver
          binary="$RUNNER_TEMP/ssserver"
          chmod +x "$binary"
          echo "SHOES_TEST_SSSERVER_BIN=$binary" >> "$GITHUB_ENV"

      - name: Install native Naive Caddy test peer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/caddy-forwardproxy-naive.tar.xz"
          gh release download "v${NAIVE_CADDY_VERSION}" --repo klzgrad/forwardproxy \
            --pattern caddy-forwardproxy-naive.tar.xz --output "$archive"
          echo "${NAIVE_CADDY_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --xz --file "$archive" --directory "$RUNNER_TEMP"
          binary="$RUNNER_TEMP/caddy-forwardproxy-naive/caddy"
          chmod +x "$binary"
          echo "SHOES_TEST_NAIVE_CADDY_BIN=$binary" >> "$GITHUB_ENV"

      - name: Run native QUIC client interoperability tests
        run: >-
          .github/require-tests.sh cargo test -p shoes --locked --lib --features optional-peer-tests
          quic_client::interop:: -- --test-threads=1

      - name: Install WebSocket early-data test peer
        id: ws_peer
        env:
          GH_TOKEN: ${{ github.token }}
          WS_SING_BOX_VERSION: 1.14.3
          WS_SING_BOX_SHA256: e2bdf179c15a3652955dc44867e33ca0965c9c9b91b34267dcc5a5d639a5feee
        run: |
          # Older sing-box clients discard response bytes read ahead during the upgrade.
          archive="$RUNNER_TEMP/ws-sing-box.tar.gz"
          gh release download "v${WS_SING_BOX_VERSION}" --repo SagerNet/sing-box \
            --pattern "sing-box-${WS_SING_BOX_VERSION}-linux-amd64.tar.gz" --output "$archive"
          echo "${WS_SING_BOX_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          echo "binary=$RUNNER_TEMP/sing-box-${WS_SING_BOX_VERSION}-linux-amd64/sing-box" >> "$GITHUB_OUTPUT"

      - name: Run WebSocket early-data interoperability tests
        env:
          CARGO_BUILD_JOBS: 1
          RUST_LOG: warn
          SHOES_TEST_SING_BOX_BIN: ${{ steps.ws_peer.outputs.binary }}
        run: |
          "$SHOES_TEST_SING_BOX_BIN" version
          .github/require-tests.sh cargo test -p shoes --locked --features ffi,optional-peer-tests \
            --test ws_early_data -- --test-threads=1

      - name: Run optional peer interoperability tests
        env:
          RUST_LOG: warn
        run: >-
          .github/require-tests.sh cargo test -p shoes --locked --features optional-peer-tests
          --test optional_peer -- --test-threads=1

  reality:
    name: REALITY interop (Xray)
    needs: [detect]
    if: needs.detect.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 1
      GOMAXPROCS: 1
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          key: reality
          cache-targets: "true"

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: false

      - uses: actions/checkout@v7
        with:
          repository: XTLS/Xray-core
          ref: a4a3dff5b20c2faae567b742c172c7b95e75c083
          path: reality-peer

      - name: Build pinned Xray
        working-directory: reality-peer
        run: go build -p 1 -o "$RUNNER_TEMP/xray" ./main

      - name: Run local REALITY peer matrix
        env:
          XRAY_BINARY: ${{ runner.temp }}/xray
        run: >-
          .github/require-tests.sh cargo test --locked --features optional-peer-tests
          --test reality_interop -- --test-threads=1

  vless-encryption:
    name: VLESS encryption interop
    needs: [detect]
    if: needs.detect.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      GOMAXPROCS: 1
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          key: vless-encryption
          cache-targets: "true"

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: false

      - uses: actions/checkout@v7
        with:
          repository: XTLS/Xray-core
          ref: a4a3dff5b20c2faae567b742c172c7b95e75c083
          path: peers/xray

      - uses: actions/checkout@v7
        with:
          repository: MetaCubeX/mihomo
          ref: 94b13aed49b8dc41973e4bb3f721c5fa2c5c5c1f
          path: peers/mihomo

      - uses: actions/checkout@v7
        with:
          repository: SagerNet/sing-box
          ref: dfb80349bf5779ec0a3f834c9ec2794345bff8f0
          path: peers/sing-box

      - uses: actions/checkout@v7
        with:
          repository: cfal/shoes
          ref: 001495285ac16e2121a539682d1a1f6a7c07c5ed
          path: peers/shoes-baseline

      - name: Build frozen Shoes baseline
        working-directory: peers/shoes-baseline
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo build --locked --bin shoes
          cp "$CARGO_TARGET_DIR/debug/shoes" "$RUNNER_TEMP/shoes-baseline"

      - name: Build pinned Xray
        working-directory: peers/xray
        run: go build -p 1 -o "$RUNNER_TEMP/xray" ./main

      - name: Build pinned Mihomo
        working-directory: peers/mihomo
        run: go build -p 1 -ldflags '-X github.com/metacubex/mihomo/constant.Version=alpha-94b13aed' -o "$RUNNER_TEMP/mihomo" .

      - name: Build legacy sing-box peer
        working-directory: peers/sing-box
        run: go build -p 1 -tags with_utls,with_quic -o "$RUNNER_TEMP/sing-box" ./cmd/sing-box

      - name: Native VLESS and Sudoku TCP peer matrix
        env:
          XRAY_BINARY: ${{ runner.temp }}/xray
          MIHOMO_BINARY: ${{ runner.temp }}/mihomo
          SHOES_TEST_SING_BOX_BIN: ${{ runner.temp }}/sing-box
        run: .github/require-tests.sh cargo test --locked --features optional-peer-tests --test vless_encryption_interop -- --test-threads=1

      - name: Sudoku cross-language wire vectors
        run: |
          .github/require-tests.sh cargo test --locked --lib sudoku_mask:: -- --test-threads=1
          SUDOKU_RUST_VECTORS="$RUNNER_TEMP/sudoku-rust.json" .github/require-tests.sh cargo test --locked --lib export_rust_wire_samples
          cd peers/xray
          go run -p 1 ../../tests/fixtures/sudoku/xray.go -verify "$RUNNER_TEMP/sudoku-rust.json"

      - name: Cross-language cryptography vectors
        run: |
          .github/require-tests.sh cargo test --locked --lib vless::encryption:: -- --test-threads=1
          VLESS_RUST_VECTORS="$RUNNER_TEMP/vless-rust.json" .github/require-tests.sh cargo test --locked --lib export_rust_encapsulations
          cd peers/xray
          go run -p 1 ../../tests/fixtures/vless_encryption/generate.go --verify-rust "$RUNNER_TEMP/vless-rust.json"

      - name: Bounded native VLESS stress
        run: .github/require-tests.sh cargo test --locked --features stress-tests --test stress vless_encryption -- --test-threads=1

      - name: Legacy baseline comparison
        env:
          XRAY_BINARY: ${{ runner.temp }}/xray
          SHOES_BASELINE_BINARY: ${{ runner.temp }}/shoes-baseline
        run: .github/require-tests.sh cargo test --locked --features optional-peer-tests --test vless_encryption_interop legacy_baseline_matches_backpressure_and_half_close -- --ignored --test-threads=1

      - name: Legacy VLESS regression
        env:
          SHOES_TEST_SING_BOX_BIN: ${{ runner.temp }}/sing-box
        run: .github/require-tests.sh cargo test --locked --features integration-tests --test integration vless -- --test-threads=1

  kernel-tun:
    name: Linux kernel TUN
    needs: [detect]
    if: needs.detect.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          key: kernel-tun
          cache-targets: "true"

      - name: Check kernel test prerequisites
        run: |
          sudo -n true
          sudo apt-get update
          sudo apt-get install -y nftables
          test -c /dev/net/tun
          command -v ip
          ip -j -6 address show dev lo | jq --exit-status 'any(.[].addr_info[]; .local == "::1")'

      - name: Run kernel TUN tests
        run: >-
          .github/require-tests.sh cargo test -p shoes --locked --features privileged-tests
          --test privileged tun_kernel:: -- --test-threads=1

      - name: Run managed capture and recovery tests
        run: |
          mkdir -p "$RUNNER_TEMP/resolved"
          (cd "$RUNNER_TEMP/resolved" && apt-get download systemd-resolved)
          dpkg-deb --extract "$RUNNER_TEMP"/resolved/*.deb "$RUNNER_TEMP/resolved/root"
          SHOES_RESOLVED_ROOT="$RUNNER_TEMP/resolved/root/usr" .github/require-tests.sh cargo test -p shoes --locked --lib \
            desktop::linux::tests::managed_kernel_capture_and_cleanup \
            -- --ignored --nocapture --test-threads=1
          .github/require-tests.sh cargo test -p shoes --locked --test process_contract \
            config_tooling::check_dry_run_does_not_dispatch_cleanup -- --ignored --nocapture

  kernel-wireguard:
    name: Kernel WireGuard
    needs: [detect]
    if: needs.detect.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          key: kernel-wireguard
          cache-targets: "true"

      - name: Install kernel WireGuard test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends wireguard-tools iproute2
          uname -r
          wg --version

      - name: Run kernel WireGuard tests
        env:
          RUST_LOG: warn
        run: >-
          .github/require-tests.sh cargo test -p shoes --locked --features privileged-tests
          --test privileged wireguard_kernel:: -- --test-threads=1

  build:
    name: Build ${{ matrix.target }}
    # Build only after every test job passes.
    needs: [detect, unit, clippy, msrv, integration, optional-peers, singbox, snell, xhttp, reality, vless-encryption, kernel-tun, kernel-wireguard, privileged]
    if: needs.detect.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            use_cross: false
          - target: x86_64-unknown-linux-musl
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            use_cross: true
          - target: aarch64-unknown-linux-musl
            use_cross: true
    env:
      TARGET: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ !matrix.use_cross && matrix.target || '' }}

      - name: Cache cross binary
        if: matrix.use_cross
        id: cache-cross
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cross
          key: cross-bin-v${{ env.CROSS_VERSION }}

      - name: Install cross binary
        if: matrix.use_cross && steps.cache-cross.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl -sSL "https://github.com/cross-rs/cross/releases/download/v${CROSS_VERSION}/cross-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.cargo/bin" cross
          chmod +x "$HOME/.cargo/bin/cross"

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ci-release-${{ matrix.target }}

      - name: Build binary (native)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --locked --target "$TARGET" --bin shoes

      - name: Build binary (cross)
        if: matrix.use_cross
        run: cross build --release --locked --target "$TARGET" --bin shoes

      - name: Verify binary
        run: |
          test -x "target/$TARGET/release/shoes"
          file "target/$TARGET/release/shoes"
          case "$TARGET" in
            *musl*) file "target/$TARGET/release/shoes" | grep -E 'static.*linked' ;;
          esac

      - name: Verify allocator and THP settings
        if: startsWith(matrix.target, 'x86_64-')
        run: |
          bin="target/$TARGET/release/shoes"
          _RJEM_MALLOC_CONF=stats_print:true "$bin" generate-vless-user-id > jemalloc-stats.txt 2>&1
          grep 'opt.thp: "never"' jemalloc-stats.txt
          grep 'opt.background_thread: true' jemalloc-stats.txt
          grep 'opt.narenas: 2' jemalloc-stats.txt
          printf -- '- address: 127.0.0.1:18089\n  protocol:\n    type: socks\n' > thp.yaml
          "$bin" thp.yaml &
          pid=$!
          sleep 2
          grep -E 'THP_enabled:\s+0' "/proc/$pid/status"
          kill "$pid"
