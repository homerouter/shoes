name: CI

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'include/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'include/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CROSS_VERSION: 0.2.5
  SHOES_BUILD_REVISION: ${{ github.sha }}

defaults:
  run:
    shell: bash

jobs:
  detect:
    name: Detect code changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether code or dependencies changed
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import tomllib

          def write_out(val: bool) -> None:
              s = "true" if val else "false"
              print(f"ci_should_run={s}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"run={s}\n")

          event = os.environ["EVENT_NAME"]
          if event == "workflow_dispatch":
              write_out(True)
              raise SystemExit(0)

          zero = "0" * 40
          base = os.environ.get("PR_BASE") if event == "pull_request" else os.environ.get("PUSH_BEFORE", "")
          if not base or base == zero or subprocess.run(["git", "cat-file", "-e", f"{base}^{{commit}}"], capture_output=True).returncode != 0:
              base = "HEAD^"

          if subprocess.run(["git", "cat-file", "-e", f"{base}^{{commit}}"], capture_output=True).returncode != 0:
              write_out(True)
              raise SystemExit(0)

          changed = subprocess.check_output(["git", "diff", "--name-only", base, "HEAD"], text=True).splitlines()
          print("Changed files:", changed)
          code_prefixes = ("src/", "tests/", "benches/", "include/", ".cargo/")
          code_files = {"build.rs", ".github/workflows/ci.yml"}
          if any(f in code_files or f.startswith(code_prefixes) for f in changed):
              write_out(True)
              raise SystemExit(0)

          cargo_changed = [f for f in changed if f in ("Cargo.toml", "Cargo.lock")]
          if not cargo_changed:
              write_out(False)
              raise SystemExit(0)

          def strip_own_version(rev: str, path: str):
              raw = subprocess.check_output(["git", "show", f"{rev}:{path}"], text=True)
              data = tomllib.loads(raw)
              if path == "Cargo.toml":
                  data["package"].pop("version", None)
              else:
                  for pkg in data.get("package", []):
                      if pkg.get("name") == "shoes" and "source" not in pkg:
                          pkg.pop("version", None)
              return data

          for path in cargo_changed:
              if strip_own_version(base, path) != strip_own_version("HEAD", path):
                  write_out(True)
                  raise SystemExit(0)

          write_out(False)
          PY

  test:
    name: Test
    needs: [detect]
    if: needs.detect.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          key: test
          cache-targets: "true"

      - name: Cache sing-box binary
        id: cache-singbox
        uses: actions/cache@v6
        with:
          path: /usr/local/bin/sing-box
          key: singbox-official-bin-1.14.4

      - name: Download official sing-box
        if: steps.cache-singbox.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/singbox"
          for attempt in 1 2 3 4 5; do
            gh release download v1.14.4 --repo SagerNet/sing-box \
              --pattern "sing-box-*-linux-amd64.tar.gz" \
              --dir "$RUNNER_TEMP/singbox" && break || {
              if [ "$attempt" -eq 5 ]; then
                echo "Failed to download sing-box after 5 attempts"
                exit 1
              fi
              echo "Download failed (attempt $attempt), retrying in 5s..."
              sleep 5
            }
          done
          tar -xzf "$RUNNER_TEMP/singbox"/sing-box-*-linux-amd64.tar.gz -C "$RUNNER_TEMP/singbox" --strip-components=1
          sudo mv "$RUNNER_TEMP/singbox/sing-box" /usr/local/bin/sing-box
          sudo chmod +x /usr/local/bin/sing-box
          /usr/local/bin/sing-box version

      - name: Cache sing-box Snell fork binary
        id: cache-singbox-snell
        uses: actions/cache@v6
        with:
          path: /usr/local/bin/sing-box-snell
          key: singbox-snell-reF1nd-e7c5f20810451fb3b9756b6ecf8acef397ccc1f3

      - name: Install Go for the sing-box Snell fork
        if: steps.cache-singbox-snell.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false

      - name: Build sing-box Snell fork
        if: steps.cache-singbox-snell.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none https://github.com/reF1nd/sing-box "$RUNNER_TEMP/sing-box-snell"
          cd "$RUNNER_TEMP/sing-box-snell"
          git checkout e7c5f20810451fb3b9756b6ecf8acef397ccc1f3
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/sing-box-snell-bin" ./cmd/sing-box
          sudo mv "$RUNNER_TEMP/sing-box-snell-bin" /usr/local/bin/sing-box-snell
          /usr/local/bin/sing-box-snell version

      - name: Run Snell unit tests
        run: |
          .github/require-tests.sh cargo test --lib --locked snell

      - name: Run remaining unit & process contract tests
        run: |
          cargo test --lib --locked -- --skip snell
          cargo test --test process_contract --locked

      - name: Run sing-box integration tests
        run: |
          cargo test --test integration --features="integration-tests" httpupgrade_singbox
          cargo test --test integration --features="integration-tests" grpc_singbox
          cargo test --test integration --features="integration-tests" h2mux_singbox

      - name: Run sing-box WireGuard interop tests
        run: |
          SHOES_TEST_SING_BOX_BIN=/usr/local/bin/sing-box cargo test --test optional_peer --features optional-peer-tests wireguard::wireguard_singbox_both_roles -- --ignored
          SHOES_TEST_SING_BOX_BIN=/usr/local/bin/sing-box cargo test --test optional_peer --features optional-peer-tests wireguard::wireguard_singbox_lazy -- --ignored

      - name: Run sing-box Snell interop tests
        run: |
          SHOES_TEST_SING_BOX_SNELL_BIN=/usr/local/bin/sing-box-snell .github/require-tests.sh cargo test --test optional_peer --features optional-peer-tests snell_singbox:: -- --ignored --test-threads=1

      - name: Run privileged tests
        run: |
          sudo -E env PATH="$PATH" cargo test --lib --locked root_config_check_accepts_service_owned_state -- --ignored
          sudo -E env PATH="$PATH" cargo test --lib --locked public_device_factory_preserves_unframed_packets -- --ignored

  build:
    name: Build ${{ matrix.target }}
    needs: [detect, test]
    if: needs.detect.outputs.run == 'true' && needs.test.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            use_cross: false
          - target: x86_64-unknown-linux-musl
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            use_cross: true
          - target: aarch64-unknown-linux-musl
            use_cross: true
    env:
      TARGET: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ !matrix.use_cross && matrix.target || '' }}

      - name: Cache cross binary
        if: matrix.use_cross
        id: cache-cross
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cross
          key: cross-bin-v${{ env.CROSS_VERSION }}

      - name: Install cross binary
        if: matrix.use_cross && steps.cache-cross.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl -sSL "https://github.com/cross-rs/cross/releases/download/v${CROSS_VERSION}/cross-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.cargo/bin" cross
          chmod +x "$HOME/.cargo/bin/cross"

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ci-release-${{ matrix.target }}

      - name: Build binary (native)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --locked --target "$TARGET" --bin shoes

      - name: Build binary (cross)
        if: matrix.use_cross
        run: cross build --release --locked --target "$TARGET" --bin shoes

      - name: Verify binary
        run: |
          test -x "target/$TARGET/release/shoes"
          file "target/$TARGET/release/shoes"
          case "$TARGET" in
            *musl*) file "target/$TARGET/release/shoes" | grep -E 'static.*linked' ;;
          esac

      - name: Verify allocator and THP settings
        if: startsWith(matrix.target, 'x86_64-')
        run: |
          bin="target/$TARGET/release/shoes"
          _RJEM_MALLOC_CONF=stats_print:true "$bin" generate-vless-user-id > jemalloc-stats.txt 2>&1
          grep 'opt.thp: "never"' jemalloc-stats.txt
          grep 'opt.background_thread: true' jemalloc-stats.txt
          grep 'opt.narenas: 2' jemalloc-stats.txt
          printf -- '- address: 127.0.0.1:18089\n  protocol:\n    type: socks\n' > thp.yaml
          "$bin" thp.yaml &
          pid=$!
          sleep 2
          grep -E 'THP_enabled:\s+0' "/proc/$pid/status"
          kill "$pid"
